<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: #0f0f1a; }
      .pre-splash {
        position: fixed; inset: 0; z-index: 9998;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0f0f1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        animation: preFade 0.4s ease;
      }
      @keyframes preFade { from { opacity: 0; } to { opacity: 1; } }
      .pre-logo { width: 100px; height: 100px; opacity: 0; animation: preLogoIn 0.5s ease 0.1s forwards; }
      @keyframes preLogoIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
      .pre-title {
        font-size: 26px; font-weight: 800; letter-spacing: -0.5px;
        background: linear-gradient(135deg, #5b8dff, #a78bfa);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text; margin-top: 16px;
        opacity: 0; animation: preTextIn 0.4s ease 0.35s forwards;
      }
      @keyframes preTextIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f0f1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Aditya</title>
    <script>
      (function(){
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(r){
            for (var i=0;i<r.length;i++) r[i].unregister();
            if (r.length>0 && !sessionStorage.getItem('swk')) {
              sessionStorage.setItem('swk','1');
              window.location.reload();
            }
          });
        }
        if (window.caches) {
          caches.keys().then(function(n){ for (var i=0;i<n.length;i++) caches.delete(n[i]); });
        }
      })();
    </script>
  </head>
  <body>
    <div class="pre-splash" id="pre-splash">
      <svg class="pre-logo" viewBox="0 0 100 100" width="100" height="100">
        <defs>
          <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#5b8dff"/>
            <stop offset="100%" stop-color="#a78bfa"/>
          </linearGradient>
        </defs>
        <path d="M 50 10 C 24 18, 8 50, 16 84" stroke="url(#pg)" stroke-width="9" stroke-linecap="round" fill="none"/>
        <path d="M 50 10 C 76 18, 92 50, 84 84" stroke="url(#pg)" stroke-width="9" stroke-linecap="round" fill="none"/>
        <path d="M 44 26 C 34 32, 24 52, 28 80" stroke="url(#pg)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M 56 26 C 66 32, 76 52, 72 80" stroke="url(#pg)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M 20 52 Q 50 46, 80 52" stroke="url(#pg)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
      </svg>
      <div class="pre-title">Aditya</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
